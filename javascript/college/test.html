<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Objects</title>
</head>
<body>
    <script> 
        // Attaching the polyfill to Array.prototype
        Array.prototype.mymap = function(callback) {
            let newArray = [];
            for (let i = 0; i < this.length; i++) {
                newArray.push(callback(this[i], i, this));
            }
            return newArray;
        }

        let arr = [1, 2, 3, 4, 5];
        let newArr = arr.mymap(function(item) {
            return item * 2;
        });
        
        console.log(newArr); // Output: [2, 4, 6, 8, 10]
    </script>
</body>
</html>
